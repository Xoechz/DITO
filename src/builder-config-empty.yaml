dist:
  name: otelcol-empty
  description: Empty connector example for OpenTelemetry Collector Builder.
  module: github.com/Xoechz/DITO/src/emptyCollector
  version: 0.142.0
  output_path: ./emptyCollector

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.142.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.142.0

connectors:
  - gomod: github.com/Xoechz/DITO/src/emptyConnector v0.0.0

replaces:
  - github.com/Xoechz/DITO/src/emptyConnector =>
    ../emptyConnector
